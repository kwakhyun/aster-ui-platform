apiVersion: apps/v1
kind: Deployment
metadata:
  name: aster-ui-studio
  labels:
    app.kubernetes.io/name: aster-ui-studio
    app.kubernetes.io/version: 3.1.0-beta.2
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aster-ui-studio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aster-ui-studio
        app.kubernetes.io/version: 3.1.0-beta.2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: __ASTER_UI_IMAGE_DIGEST__
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aster-ui-studio
spec:
  selector:
    app.kubernetes.io/name: aster-ui-studio
  ports:
    - name: http
      port: 80
      targetPort: http

name: Refresh Linux visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.29.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate the complete Linux baseline set
        run: pnpm test:visual:update
        env:
          CI: true
      - name: Upload reviewable baselines
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: visual-baselines-linux-${{ github.sha }}
          path: tests/visual/__screenshots__/linux
          if-no-files-found: error
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the ordered production verification gate
        run: pnpm verify
        env:
          CI: true

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag aster-ui-studio:ci .
      - name: Verify hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f aster-ui-studio-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach \
            --name aster-ui-studio-ci \
            --read-only \
            --tmpfs /var/cache/nginx:uid=101,gid=101,mode=770 \
            --tmpfs /tmp:uid=101,gid=101,mode=770 \
            --publish 127.0.0.1:8080:8080 \
            aster-ui-studio:ci
          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            --output /tmp/aster-ui-health.html \
            http://127.0.0.1:8080/healthz
          grep -q '<div id="root"></div>' /tmp/aster-ui-health.html
          test "$(docker inspect --format '{{.Config.User}}' aster-ui-studio-ci)" = "nginx"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' aster-ui-studio-ci)" = "true"
          curl --fail --silent --show-error \
            --dump-header /tmp/aster-ui-headers \
            --output /tmp/aster-ui-index.html \
            http://127.0.0.1:8080/components/treatment-card
          grep -q '<div id="root"></div>' /tmp/aster-ui-index.html
          mapfile -t assets < <(grep -oE '(src|href)="/assets/[^"]+"' /tmp/aster-ui-index.html | cut -d'"' -f2 | sort -u)
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:8080${asset}"
          done
          grep -qi '^Content-Security-Policy:' /tmp/aster-ui-headers
          ! grep -qi "unsafe-inline" /tmp/aster-ui-headers
          grep -qi '^X-Frame-Options: DENY' /tmp/aster-ui-headers

  pages:
    if: github.event_name == 'push'
    needs: [quality, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: pnpm install --frozen-lockfile
      - name: Build the verified Studio for the repository base path
        run: pnpm build
        env:
          ASTER_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/studio/dist/client
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

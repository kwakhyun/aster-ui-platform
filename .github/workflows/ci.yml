name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.29.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the ordered production verification gate
        run: pnpm verify
        env:
          CI: true
      - name: Upload visual regression diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: visual-regression-${{ runner.os }}-${{ github.run_attempt }}
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag aster-ui-studio:ci .
      - name: Verify hardened runtime
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f aster-ui-studio-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach \
            --name aster-ui-studio-ci \
            --read-only \
            --tmpfs /var/cache/nginx:uid=101,gid=101,mode=770 \
            --tmpfs /tmp:uid=101,gid=101,mode=770 \
            --publish 127.0.0.1:8080:8080 \
            aster-ui-studio:ci
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 \
            --output /tmp/aster-ui-health.html \
            http://127.0.0.1:8080/healthz
          grep -q '<div id="root"></div>' /tmp/aster-ui-health.html
          test "$(docker inspect --format '{{.Config.User}}' aster-ui-studio-ci)" = "nginx"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' aster-ui-studio-ci)" = "true"
          curl --fail --silent --show-error \
            --dump-header /tmp/aster-ui-headers \
            --output /tmp/aster-ui-index.html \
            http://127.0.0.1:8080/components/treatment-card
          grep -q '<div id="root"></div>' /tmp/aster-ui-index.html
          mapfile -t assets < <(grep -oE '(src|href)="/assets/[^"]+"' /tmp/aster-ui-index.html | cut -d'"' -f2 | sort -u)
          test "${#assets[@]}" -gt 0
          for asset in "${assets[@]}"; do
            curl --fail --silent --show-error --output /dev/null "http://127.0.0.1:8080${asset}"
          done
          grep -qi '^Content-Security-Policy:' /tmp/aster-ui-headers
          ! grep -qi "unsafe-inline" /tmp/aster-ui-headers
          grep -qi '^X-Frame-Options: DENY' /tmp/aster-ui-headers

  pages:
    if: github.event_name == 'push'
    needs: [quality, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.29.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
          cache: pnpm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: pnpm install --frozen-lockfile
      - name: Build the verified Studio for the repository base path
        run: pnpm build
        env:
          ASTER_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/studio/dist/client
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

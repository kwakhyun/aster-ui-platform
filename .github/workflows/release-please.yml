name: Release Please

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create or update the release pull request
        if: vars.RELEASE_PLEASE_PR_ENABLED == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Report the safe public-repository boundary
        if: vars.RELEASE_PLEASE_PR_ENABLED != 'true'
        run: echo "Release contract verification passed; release PR creation remains explicitly disabled."
